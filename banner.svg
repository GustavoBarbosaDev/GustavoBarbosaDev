<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Gustavo Barbosa, desenvolvedor backend Python">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.65" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#140404"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2b2b"/>
      <stop offset="1" stop-color="#a30000"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2b2b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2b2b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff2b2b" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- moldura com cantos cortados (estilo HUD, sem cara de janela) -->
    <clipPath id="frame"><polygon points="0,0 968,0 1000,32 1000,320 32,320 0,288"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .log   { font-size: 15px; fill: #cfcfcf; opacity: 0; }
    .warn  { fill: #ff2b2b; }
    .cy    { fill: #ff2b2b; }
    .dim   { fill: #6a6a6a; }
    .hud   { font-size: 12px; letter-spacing: 3px; }
    .title { font-size: 58px; font-weight: 700; letter-spacing: 6px; fill: url(#neon); opacity: 0; }
    .sub   { font-size: 17px; letter-spacing: 3px; fill: #8a8a8a; opacity: 0; }
    .cursor{ animation: blink 1s steps(1) infinite; }
    .scan  { animation: scan 4s linear infinite; }
    .l1{animation:k1 14s infinite}
    .l2{animation:k2 14s infinite}
    .l3{animation:k3 14s infinite}
    .l4{animation:k4 14s infinite}
    .l5{animation:k5 14s infinite}
    .t1{animation:kt 14s infinite}
    .t2{animation:ks 14s infinite}

    @keyframes k1{0%,3%{opacity:0}5%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes k2{0%,11%{opacity:0}13%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes k3{0%,19%{opacity:0}21%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes k4{0%,27%{opacity:0}29%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes k5{0%,35%{opacity:0}37%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes kt{0%,45%{opacity:0}47%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes ks{0%,56%{opacity:0}59%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes scan{from{transform:translateY(-80px)}to{transform:translateY(340px)}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- barra HUD superior (sem botões de janela) -->
    <rect width="1000" height="34" fill="#0a0a0a"/>
    <rect x="0" y="0" width="6" height="34" fill="#ff2b2b"/>
    <text x="24" y="22" class="hud warn">SYS://BACKEND_CORE</text>
    <text x="500" y="22" text-anchor="middle" class="hud dim">root@backend-core:~/boot</text>
    <text x="950" y="22" text-anchor="end" class="hud dim">ONLINE</text>
    <circle class="cursor" cx="968" cy="17" r="5" fill="#ff2b2b"/>
    <line x1="0" y1="34" x2="1000" y2="34" stroke="#ff2b2b" stroke-opacity="0.35"/>

    <!-- logs de boot -->
    <text x="36" y="72"  class="log l1"><tspan class="cy">[ OK ]</tspan> booting backend_core ...</text>
    <text x="36" y="96"  class="log l2"><tspan class="cy">[ OK ]</tspan> loading modules: python · fastapi · postgres · redis</text>
    <text x="36" y="120" class="log l3"><tspan class="cy">[ OK ]</tspan> connecting database ................ <tspan class="warn">connected</tspan></text>
    <text x="36" y="144" class="log l4"><tspan class="cy">[ OK ]</tspan> starting api gateway on <tspan class="warn">:8000</tspan></text>
    <text x="36" y="168" class="log l5"><tspan class="cy">[ ** ]</tspan> system online. open to work<tspan class="cursor warn"> █</tspan></text>

    <!-- título -->
    <text x="500" y="238" text-anchor="middle" class="title t1" filter="url(#glow)">GUSTAVO BARBOSA</text>
    <text x="500" y="276" text-anchor="middle" class="sub t2">BACKEND DEVELOPER  //  PYTHON  //  FASTAPI  //  POSTGRESQL</text>

    <!-- detalhes HUD nos cantos -->
    <path d="M20 296 V308 H44" fill="none" stroke="#ff2b2b" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M980 300 H956 M980 300 V288" fill="none" stroke="#ff2b2b" stroke-width="2" stroke-opacity="0.7"/>
    <text x="940" y="306" text-anchor="end" class="hud dim" font-size="11">ALTOS, PI // BRASIL</text>

    <!-- scanline -->
    <rect class="scan" x="0" y="0" width="1000" height="80" fill="url(#scanGrad)"/>
  </g>

  <!-- moldura com cantos cortados -->
  <polygon points="1,1 968,1 999,32 999,319 32,319 1,288" fill="none" stroke="url(#neon)" stroke-width="2" stroke-opacity="0.85"/>
</svg>
