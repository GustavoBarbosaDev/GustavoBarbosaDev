name: Update README Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"   # uma vez por dia à meia-noite (UTC)
  workflow_dispatch:       # permite rodar manualmente
  push:
    branches:
      - main
    paths:
      - "README.md"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Gerar card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0d1117&title_color=ff2b2b&icon_color=ff2b2b&text_color=c9d1d9&ring_color=ff2b2b"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=5&hide_border=true&bg_color=0d1117&title_color=ff2b2b&text_color=c9d1d9&bar_color=ff2b2b"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar card do projeto Socialink
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=socialink&theme=radical&bg_color=0d1117&border_color=ff2b2b&title_color=ff2b2b&icon_color=ff2b2b&text_color=c9d1d9"
          path: profile/pin-socialink.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit dos cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: atualiza cards de estatísticas do README" || exit 0
          git push
